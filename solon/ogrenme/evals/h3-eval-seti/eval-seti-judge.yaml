# H3 — yargıç koşumu: aynı 10 vaka (Türkçe), llm-rubric assert'i ile puanlanır.
# Rubrik yalnızca NİHAİ CEVABIN doğruluğuna bakar (kutu 2 rubrik ilkesi), pass=doğru/fail=yanlış (kutu 6 kappa için ikili).
- vars:
    soru: "Janet'in ördekleri günde 16 yumurta yumurtluyor. Janet her sabah kahvaltıda üç yumurta yiyor ve her gün arkadaşları için dört yumurtayla kek pişiriyor. Kalanını çiftçi pazarında taze ördek yumurtası başına 2 dolardan satıyor. Çiftçi pazarında her gün kaç dolar kazanıyor?"
    beklenen: "18"
  assert:
    - type: llm-rubric
      value: "Bu bir matematik sorusu çözümüdür. Yalnızca çıktının NİHAİ SAYISAL CEVABININ doğru olup olmadığına bak (ara adımların yazım biçimini değil). Doğru cevap: {{beklenen}}. Nihai cevap bu değere eşitse pass=true, değilse pass=false ver."

- vars:
    soru: "Bir cübbe 2 top mavi kumaş ve bunun yarısı kadar beyaz kumaş gerektiriyor. Toplamda kaç top kumaş gerekir?"
    beklenen: "3"
  assert:
    - type: llm-rubric
      value: "Bu bir matematik sorusu çözümüdür. Yalnızca çıktının NİHAİ SAYISAL CEVABININ doğru olup olmadığına bak. Doğru cevap: {{beklenen}}. Nihai cevap bu değere eşitse pass=true, değilse pass=false ver."

- vars:
    soru: "Josh bir ev alıp satmayı (flipping) deniyor. Evi 80.000 dolara alıyor, sonra 50.000 dolar tamirat yapıyor. Bu, evin değerini %150 artırıyor. Josh ne kadar kâr etti?"
    beklenen: "70000"
  assert:
    - type: llm-rubric
      value: "Bu bir matematik sorusu çözümüdür. Yalnızca çıktının NİHAİ SAYISAL CEVABININ doğru olup olmadığına bak. Doğru cevap: {{beklenen}}. Nihai cevap bu değere eşitse pass=true, değilse pass=false ver."

- vars:
    soru: "John, saatte 60 mil hızla 3 saat araba sürüyor, sonra evde çok önemli bir şeyi unuttuğunu fark edip geri dönüyor. Eve 4 saatte varmaya çalışıyor ama ilk 2 saati durgun trafikte geçiriyor. Sonraki yarım saati saatte 30 mil hızla sürüyor, ardından 4 saatin kalan süresinde saatte 80 mil hızla sürebiliyor. Bu 4 saatin sonunda evine kaç mil uzaklıktadır?"
    beklenen: "45"
  assert:
    - type: llm-rubric
      value: "Bu bir matematik sorusu çözümüdür. Yalnızca çıktının NİHAİ SAYISAL CEVABININ doğru olup olmadığına bak. Doğru cevap: {{beklenen}}. Nihai cevap bu değere eşitse pass=true, değilse pass=false ver."


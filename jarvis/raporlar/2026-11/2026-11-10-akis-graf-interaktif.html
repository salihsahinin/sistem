<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akış Grafı</title>
<style>
:root{--bg:#f7f7f5;--fg:#1a1a1a;--mut:#6b6b6b;--line:#d9d9d4;--pan:#ffffff;--vurgu:#eef3fa;
 --seans:#2b6cb0;--is-tamam:#2f855a;--is-acik:#b7791f;--is-islemde:#c05621;--is-bayat:#9b9b9b;--hedef:#805ad5;--merkez:#c53030;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#ececec;--mut:#9a9a9a;--line:#333;--pan:#1e1e1e;--vurgu:#1d2733;}}
:root[data-theme="dark"]{--bg:#141414;--fg:#ececec;--mut:#9a9a9a;--line:#333;--pan:#1e1e1e;--vurgu:#1d2733;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header small{color:var(--mut);font-size:12px}
main{display:flex;flex:1;min-height:0}
#graf{flex:1;min-width:0;min-height:560px;position:relative;overflow:auto;max-height:calc(100vh - 52px)}
svg{display:block}
#panel{width:460px;max-width:48vw;border-left:1px solid var(--line);background:var(--pan);padding:14px 16px;overflow:auto;max-height:calc(100vh - 52px)}
#panel h2{font-size:16px;margin:0 0 4px}
#panel .tur{color:var(--mut);font-size:13px;margin-bottom:10px}
#panel p{margin:0 0 8px}
#panel ul{margin:0 0 8px 18px;padding:0}
#panel li{margin:0 0 6px}
#panel .kutu{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:10px 0}
#panel .kutu.ozet{background:var(--vurgu)}
#panel .kutu h3{font-size:13px;margin:0 0 6px;color:var(--mut)}
#panel a{color:var(--seans)}
#panel button.komsu{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0;color:var(--fg);cursor:pointer;font:inherit}
#panel button.komsu:hover{border-color:var(--seans)}
#panel button.hedefe{background:var(--hedef);color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;margin:4px 0}
#panel table{border-collapse:collapse;width:100%;font-size:12.5px}
#panel td{border-top:1px solid var(--line);padding:3px 4px;vertical-align:top;word-break:break-word}
#panel td:first-child{color:var(--mut);white-space:nowrap}
#panel details summary{cursor:pointer;color:var(--mut);font-size:13px}
.lejant{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.lejant span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--c)}
.lejant span.bos::before{background:none;border:2px solid var(--mut);width:7px;height:7px}
.lejant span.cizgi::before{border-radius:0;height:2px;width:14px}
#kirinti button{background:none;border:none;color:var(--seans);cursor:pointer;font:inherit;padding:0 2px}
#kirinti b{color:var(--fg)}
.rozet{fill:var(--mut);font-size:9.5px}
.dugum.katli circle{stroke-width:3px}
.dugum circle{cursor:pointer}
.dugum text{pointer-events:none;fill:var(--fg)}
.dugum.secili circle{stroke:var(--merkez)!important;stroke-width:3px!important}
.kenar{fill:none;stroke-opacity:.5}
.kenar.girdi{stroke:var(--is-tamam)} .kenar.hizmet{stroke:var(--hedef)} .kenar.acti,.kenar.bitirdi{stroke:var(--seans)} .kenar.sonra{stroke:var(--mut)}
.kenar.vurgulu{stroke-opacity:1;stroke-width:2.5px}
.bant{fill:none;stroke:var(--line)}
.bant-etiket{fill:var(--mut);font-size:12px;font-weight:600}
.gun{stroke:var(--line);stroke-dasharray:2 4}
.gun-etiket{fill:var(--mut);font-size:11px}
button.ust{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--fg);cursor:pointer;font:inherit}
button.ust.aktif{border-color:var(--seans);color:var(--seans)}
code{font-size:12.5px;word-break:break-all}
/* B8: üst görev şeridi + hedef bağı + oda sekmesi */
#sekmeler{display:flex;gap:6px;flex-wrap:wrap}
#serit{border-bottom:1px solid var(--line);padding:6px 16px 8px}
#serit .serit-bas{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:4px;flex-wrap:wrap}
#serit .kutular{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#serit.acik .kutular{flex-wrap:wrap;overflow-x:visible;max-height:40vh;overflow-y:auto}
.iskutu{flex:0 0 210px;border:1px solid var(--line);border-left:4px solid var(--is-tamam);border-radius:6px;padding:4px 7px;background:var(--pan);cursor:pointer;font-size:12px;line-height:1.35;text-align:left;color:var(--fg)}
.iskutu.acik{border-left-color:var(--is-acik)} .iskutu.islemde{border-left-color:var(--is-islemde)} .iskutu.bayat{border-left-color:var(--is-bayat)}
.iskutu:hover{border-color:var(--seans)}
.iskutu.secili{outline:2px solid var(--merkez)}
.iskutu.hizmetci{background:var(--vurgu);border-color:var(--hedef)}
.iskutu .ust-satir{color:var(--mut);font-size:11px}
.iskutu .et{display:block;margin:1px 0 2px}
.hedefbag{display:inline-block;color:var(--hedef);background:none;border:none;padding:0;font:inherit;font-size:11px;cursor:pointer;text-align:left}
.hedefbag:hover{text-decoration:underline}
.hedefbag.yok{color:var(--mut);cursor:default;text-decoration:none!important}
.dugum.hizmetci circle{stroke:var(--hedef)!important;stroke-width:3.5px!important}
#oda{flex:1;padding:14px 16px;overflow:auto;max-height:calc(100vh - 52px);display:none}
#oda h2{font-size:16px;margin:0 0 4px}
#oda h3{font-size:13.5px;margin:14px 0 6px;color:var(--mut)}
#oda table{border-collapse:collapse;width:100%;font-size:13px}
#oda th,#oda td{border-top:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
#oda th{color:var(--mut);font-weight:600}
#oda details summary{cursor:pointer}
#oda pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Consolas,monospace;background:var(--vurgu);border-radius:6px;padding:8px;margin:6px 0}
#oda .akis div.tur-satir{border-top:1px solid var(--line);padding:5px 0;font-size:13px}
#oda .akis .meta{color:var(--mut);font-size:11.5px}
#oda .akis .etiket{color:var(--hedef);font-size:11.5px}
#oda .akis .metin{white-space:pre-wrap;word-break:break-word}
#oda button.git{background:none;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--seans);cursor:pointer;font:inherit;font-size:12px}
.rozet-d{display:inline-block;border-radius:4px;padding:0 5px;font-size:11.5px;background:var(--vurgu)}
@media (max-width:760px){main{flex-direction:column}#panel{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);max-height:50vh}}
</style>
</head>
<body>
<header>
 <h1>Akış grafı</h1>
 <span id="sekmeler"></span>
 <span><button class="ust aktif" id="g-bant">Bantlar (tür × kategori)</button><button class="ust" id="g-sira">Tek sıra (tüm düğümler)</button></span>
 <span id="kirinti" style="font-size:13px"></span>
 <button class="ust" id="merkeze">Bu chat</button>
 <div class="lejant">
  <span style="--c:var(--seans)">oturum</span>
  <span style="--c:var(--hedef)">hedef</span>
  <span style="--c:var(--is-tamam)">iş</span>
  <span class="bos">içi boş = henüz bitmedi</span>
  <span style="--c:var(--is-bayat)">bayat</span>
  <span class="cizgi" style="--c:var(--is-tamam)">girdi</span><span class="cizgi" style="--c:var(--hedef)">hizmet</span><span class="cizgi" style="--c:var(--seans)">açtı / bitirdi</span><span class="cizgi" style="--c:var(--mut)">sonra</span>
 </div>
 <small id="asof"></small>
</header>
<section id="serit"></section>
<main>
 <div id="graf"><svg></svg></div>
 <div id="oda"></div>
 <aside id="panel"></aside>
</main>

const ODALAR = [{"id": "202611101157-depo-denetimi-2026-11-10", "baslik": "Depo denetimi 2026-11-10: bozuk, tutarsız, verimsiz, gereksiz", "acilis": "2026-11-10T11:57:33.840Z", "maksParalel": 12, "turlar": [{"ts": "2026-11-10T11:57:33.841Z", "kim": "jarvis", "tur": "not", "metin": "Oda açıldı: Depo denetimi 2026-11-10: bozuk, tutarsız, verimsiz, gereksiz (paralel sınır 6)"}, {"ts": "2026-11-10T11:57:38.493Z", "kim": "jarvis", "tur": "plan", "metin": "Hedef (Salih 2026-11-10): C:\\sistem\\sistem deposunun tamamı okunur; bozuk, tutarsız, verimsiz ya da artık gereksiz her şey bulunur. İşçiler salt-okur denetler ve bulgu listesi döner; düzeltmeyi yalnız Jarvis (ana-sıra) yapar. Bölüm: (1) Rust kod + hook zinciri (2) Python araçları (3) kanon + skill tutarlılığı (4) alan ajanları + şablonlar + ortak (5) lean + mods + graf + wiki + kuyruk + veri (6) cc + raporlar + arşiv. Mekanik kontroller (cargo check, lake build, py_compile, bash -n, JSON, symlink) Jarvis'te koşuyor. Bulgu biçimi: yol:satır · sınıf (bozuk/tutarsız/verimsiz/gereksiz) · kanıt · önerilen düzeltme · güven (kesin/şüpheli)."}, {"ts": "2026-11-10T11:57:54.431Z", "kim": "jarvis", "tur": "gorev", "metin": "#1 [izole] Denetim 1: Rust kod + hook zinciri → opus · bütçe 70 · kütük iş #89", "gorevId": 1}, {"ts": "2026-11-10T11:57:54.663Z", "kim": "oda", "tur": "not", "metin": "#1 Denetim 1: Rust kod + hook zinciri başladı (claude-opus-5-5, ajan abaabb1f13914ef96)", "gorevId": 1}, {"ts": "2026-11-10T11:58:05.009Z", "kim": "jarvis", "tur": "gorev", "metin": "#2 [izole] Denetim 2: Python araçları + SCRIPTLER → sonnet · bütçe 60 · kütük iş #90", "gorevId": 2}, {"ts": "2026-11-10T11:58:05.219Z", "kim": "oda", "tur": "not", "metin": "#2 Denetim 2: Python araçları + SCRIPTLER başladı (claude-sonnet-5-5, ajan ae8896c246194c3a9)", "gorevId": 2}, {"ts": "2026-11-10T11:58:05.584Z", "kim": "salih", "tur": "not", "metin": "paralel sınır 6 → 7"}, {"ts": "2026-11-10T11:58:05.743Z", "kim": "salih", "tur": "not", "metin": "paralel s  git durumuna dokunulmadı. Tek tavsiye notu: `.claude/` içeren Bash komutları PreToolUse teline takılıyor, bu yüzden CRLF doğrulamasını Grep ile yaptım.\n\n## Bulgular (önem sırasıyla)\n\n1. `*/.claude/settings.json` (friday hariç 7 alan ajanı), `sablonlar/ajan-iskelet/claude-ayar/settings.json` | **bozuk** | deny kuralları `Read(~/sistem/jarvis/**)`, `Write(~/sistem/sablonlar/**)` vb. Mac yolu. Bu makinede `~/sistem` = `C:\\Users\\sasah\\sistem` ve yok (`ls -d ~/sistem` hata verdi). Depo `C:\\sistem\\sistem`'de. | Yolu Windows depo köküne göre yeniden yaz (şablon + 8 kopya). | kesin (yolun yokluğu doğrulandı). Deny'nin bu çözümlemeyle eşleşmediğini varsayıyorum, harness davranışını çalıştırıp denemedim. Okuma kilidi hook'ta olduğu için sızıntı sınırlı, ama yazma ve push frenleri deny'ye bağlı.\n2. `friday/.claude/` | **tutarsız** | Şablondaki `agents/hakem.md`, `agent-memory/hakem/`, `okuma-izin-ek`, `skills/ogren` yok. `okuma-izin.sh` v0.5 (v0.6 `okuma-izin-ek` desteği ve `AJAN_HOOK_TEST` yok). settings deny'sinde `Edit(kanon/**)`/`Write(kanon/**)` var; `kanon/` yok (`friday/README.md:3` \"kanon/ symlink emekli\" diyor). `ogrenme/**` ve `sablonlar/**` yazma deny'si yok. | Friday'i şablona göre yeniden doğur ya da bilinçli sapmayı belgele. | kesin\n3. `friday/.DS_Store` | **gereksiz** | `git ls-files friday/.DS_Store` izliyor (ilk import commit'i 51952480); kök `.gitignore`'da `.DS_Store` var ama izlenen dosya etkilenmez. `git status`'ta sürekli `M`. | `git rm --cached friday/.DS_Store`. | kesin\n4. `sage|vega|deci/.claude/hooks/*.sh` | **tutarsız** | `git ls-files --eol`: sage 3, vega 3, deci 2 hook `i/crlf w/crlf`. tart, gard, span, calc LF. Şablon LF. sage'de CRLF'li hook'u çalıştırdım, exit=2 döndü, yani çalışıyor. | Hepsini LF'ye çevir, `.gitattributes` ile `*.sh text eol=lf` sabitle (şu an `.gitattributes` yok). | kesin\n5. `deci/.claude/hooks/okuma-izin-test.sh:26,43,44` (vega, sage, gard aynı) | **tutarsız** | `tart` kopyasından tek fark `tart`→`<ajan>` yol EADME'de yaz. | kesin\n21. `cc/gorev/2026-07/gorev-2026-07-17-1.md`, `2026-07-28-2`, `2026-08/gorev-2026-08-01-21`, `2026-08-02-2`, `2026-08-03-3`, `2026-08-15-7`, `2026-08-21-1` | tutarsız | 7 görev emrinin eşleşen `rapor-*.md` dosyası yok. 08-15-7 ve 08-21-1 pipeline işçi özeti olarak sonuçlanmış olabilir, kontrol etmedim. | Her birine \"teslim = ...\" pointer'ı ekle. | şüpheli\n22. `cc/rapor/2026-07/rapor-2026-07-21-1.md`, `cc/rapor/2026-08/rapor-2026-08-26-3.md` | tutarsız | Eşleşen `gorev-*.md` yok. | Görev emri pointer'ı ekle. | şüpheli\n23. `cc/workflow/2026-08-17-agile-m40b-wf_fc0e9f76.js` | gereksiz | Dışarıdan (workflow dizini dışı) referansı yok. Yalnız `cc/workflow/README.md` listeliyor. Diğer 12 script'in en az 1 dış referansı var. | Kullanılmıyorsa arşive indir. | şüpheli\n24. `cc/devir/friday-2026-09-09-parti5/devir-2026-09-09-parti5/readme/cc/...` | verimsiz | İç içe aynalanmış dizin ağacı (`readme/cc/gorev/2026-07/README.md`, `readme/raporlar/...`: 9 dosya). Güncel README'lerden farklı blob (taslak önerisi). İçeriğe hook yüzünden bakamadım. | Taslaksa tek dosyaya indir ya da arşivle. | şüpheli\n25. `arsiv/karantina/Basliksiz-2026-09-05.canvas` | gereksiz | 2 bayt, başlıksız. | Boşsa arşivden çıkar ya da README'de nedenini yaz. | şüpheli\n26. `.claude/skills/pipeline-kosum/evals/evals.json:4`, `tools/testler/test_kolon_katmani.py:2`, `tools/testler/test_tarama_plan.py:2` | tutarsız | Eski düz yolu (`cc/pipeline-2026-...`) gösteriyor. Gerçek yol `cc/pipeline/`. Yalnız yorum ve docstring, kod işlevi kırılmıyor. | Yolları güncelle. | kesin\n27. `wiki/baglam-anahtar-kaydi.md:3` ve `.claude/skills/yol-planla/evals/evals.json` | tutarsız | Eski `cc/(rapor|gorev)-2026-...` düz yoluna atıf. | Aynı. | kesin\n28. `arsiv/README.md` içindeki kalıp (`arsiv/kapsul-YYYY-MM-DD.md`, `arsiv/tuzuk-madde-arsivi-YYYY-MM-DD.md`) | tutarsız | Bu iki ad ya da şablon `git grep` ile canlı dosyalarda geçiyor ama dosyaları yok (şablon adı, kırık pointer değil). Bilgi amaçlı. | Gerekmez, şablon olduğunu belirt. | şüpheli\n29. `raporlar/2026-10-29-sokrates-ajani/` | tutarsız | Ay klasörü yerine tarihli konu klasörü, kökte (13 dosya). Diğer konu raporları `raporlar/2026-10/` altında. | `raporlar/2026-10/` altına taşı. | şüpheli\n30. `raporlar/2026-11-01-son-50-prompt.md` vs `raporlar/2026-11-10-son-50-prompt.md` | tutarsız | `2026-11-10-son-50-prompt.md` izlenmiyor (`git status` `??`). Diğer 40 günlük snapshot izleniyor. | Seans kapanışında commit'e al. | kesin\n31. `raporlar/hareket/hareket-gunlugu-2026-11-10.md` | tutarsız | `git status` ` M`: değişmiş, commit'lenmemiş. 14:49 satır 35 adımı \"hata\" olarak kayıtlı, hemen ardından aynı komut \"tamam\". Kayıt bütünlüğü açısından bilgi. | Seans kapanışında commit'e al. | kesin\n\n**Boyut ve ikili listesi (>1 MB ya da png/pdf/sqlite/zip)**\n- `arsiv/worktree-kalinti-2026-11-10/omp-rust-p1/degisiklik.patch`: 1.502.865 bayt\n- `raporlar/2026-08/skill-doctor-rapor-2026-08-29.html`: 1.185.342 bayt\n- `raporlar/jarvis/jarvis-genel-bakis-archify-2026-08-29.visual-check.{1440x900,2048x1320}.{dark,light}.png`: 4 png (boyutlarını ölçmedim)\n- pdf, sqlite, zip, `.DS_Store` izlenen yok.\n\n**Özet**\n- Taranan dosya sayısı: cc 510, raporlar 485, arsiv 83 (git ls-files). Hepsi için ad, boyut, sha1 ve boş dosya taraması yapıldı. İçerik okuması örneklemeli: 5 pipeline, 7 gorev başlığı, 21 seans json şeması (tamamı), README'ler.\n- Taranmayan: `cc/gelen`, `cc/giden`, `.aktif-devir` ve `cc/devir/**` içeriği (alt-ajan okuma kilidi, (h) bakılamadı). `cc/rapor` ve `cc/gorev` içerikleri tek tek okunmadı. d2-eval, kanit-bulucu, denetci-kalibrasyon yalnız ad ve sha ile baktım. Görev kapsamında olmayan canlı kod referansları yalnız `git grep` ile tarandı.\n- Genel hüküm: Bozuk JSON, açık kalmış manifest ya da kritik büyük ikili yok. Sorun yapısal tutarsızlık ve gürültü. Açılış kapısının 5 \"açık\" uyarısından 2'si (ajan-metodolojisi, ingest-semasi) güncellenmemiş durum alanı, 1'i yanlış alarm (baglam-silver, kelime eşleşmesi), 2'si (erisim-fts, silver-saglik) gerçekten kısmen açık. Kapının kelime eşleşmesi bu yanlış alarmların kaynağı. Kalan işler: README'lerin yerleşimle eşlenmesi, `raporlar/` kökünün toparlanması ve birkaç kopya/boş dosya.\n\nDeğiştirilen dosya yok. Jarvis kök dizini: `C:\\sistem\\sistem\\jarvis`.", "kapanis": "2026-11-10T12:05:09.794Z"}, {"id": 7, "baslik": "Düzeltme 7: hook crate kilit açıkları", "emir": "Amaç: C:\\sistem\\sistem deposunda (Windows 11, Git Bash) `jarvis/kod/hook` crate'inde denetimde kesinleşmiş hataları düzelt. Yalnız listedeki 4 dosyaya yaz. Kök neden düzeltilir; kapsam dışı yeniden düzenleme yapma.\n\nDüzeltmeler:\n1. `src/altajan_okuma.rs` (≈satır 167, yol çözme): Git Bash yolu `/c/sistem/...` Windows yoluna çevrilmediği için `C:\\c\\sistem\\...` oluyor ve yasak listesiyle eşleşmiyor; alt-ajan `cat /c/sistem/sistem/jarvis/core/durum-kapsulu.md` komutu kilidi atlatıyor (exit 0; göreli yolda exit 2). Çözümden önce `^/([a-zA-Z])/` önekini `X:/` biçimine çevir (ayrıca `/cygdrive/x/` varsa aynı). Birim testi ekle: `/c/...` biçimi ile `C:/...` biçimi aynı sonucu verir.\n2. `src/core_tel.rs` (≈satır 13): Bash yönlendirme deseni yalnız göreli `core/` yolunu yakalıyor; `echo x > /c/sistem/sistem/jarvis/core/deneme.md` kesilmiyor. Deseni mutlak önekli yolları da (`/c/.../jarvis/core/`, `C:/...`, `C:\\...`) yakalayacak biçimde genişlet; mevcut izin verilen durumları bozma. Birim testi ekle. Satır 14'teki `mv|cp|rm|touch|tee` deseninin salt-okur komutu da kesmesi (ör. `grep -n tee core/x.md`) sorununa dokunma; yalnız raporda not et.\n3. `src/dispatch.rs` (≈satır 47): matcher `\"*\"` olduğunda `^(?:*)$` derlenmiyor ve hook sessizce atlanıyor; `\"*\"` değerini boş matcher gibi (hepsi) ele al. Test ekle.\n4. `src/session_start.rs` (≈satır 133, 152): silver bayat mesajı `python3 tools/katman-hatti.py` öneriyor; Rust ikilisi var. Metni `../target/release/katman-hatti` yap. (≈satır 174): brif `tools/ad-esitligi-denetim.py` diyor, dosya arşivde; `../targe function kenarCiz(poz,kok){
  g.selectAll("path.kenar").data(G.kenarlar.filter(e=>poz.has(e.k)&&poz.has(e.h))).join("path")
    .attr("class",e=>"kenar "+e.tur+((e.k===kok||e.h===kok)?" vurgulu":"")).attr("stroke-width",1.2)
    .attr("d",e=>{const a=poz.get(e.k),b=poz.get(e.h); if(Math.abs(a.y-b.y)<1){ const r=Math.abs(b.x-a.x)/2; return `M${a.x},${a.y}A${r},${Math.min(r,90)} 0 0 ${b.x>a.x?1:0} ${b.x},${b.y}`;} const dx=Math.max(24,Math.abs(b.x-a.x)/2); return `M${a.x},${a.y}C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;})
    .append("title").text(e=>e.k+" → "+e.h+" ("+e.tur+")");
}
function gunCizgileri(anlar,x,adim,y1,y2){
  const gunler=new Map(); anlar.forEach(a=>{ const gun=a.startsWith("9999")?"bitmemiş →":a.slice(0,10); if(!gunler.has(gun)) gunler.set(gun,a); });
  gunler.forEach((a,gun)=>{ g.append("line").attr("class","gun").attr("x1",x(a)-adim/2).attr("x2",x(a)-adim/2).attr("y1",y1).attr("y2",y2); g.append("text").attr("class","gun-etiket").attr("x",x(a)-adim/2+3).attr("y",y2+12).text(gun); });
}

function cizBant(kok){
  const hop=hopHesapla(kok);
  const dugumler=gorunenler();
  const anlar=Array.from(new Set(dugumler.map(icraZaman))).sort();
  const sol=200, sag=40, ust=26, adim=Math.max(34,Math.min(70,(genislik()-sol-sag)/Math.max(1,anlar.length-1)));
  const x=d3.scalePoint().domain(anlar).range([sol,sol+adim*(anlar.length-1)]);
  const W=sol+adim*(anlar.length-1)+sag;
  const katIlk=k=>d3.min(dugumler.filter(n=>n.tur==="is"&&kategori(n)===k),icraZaman);
  const kats=Array.from(new Set(dugumler.filter(n=>n.tur==="is").map(kategori))).sort((a,b)=>d3.ascending(katIlk(a),katIlk(b)));
  const bantlar=[{ad:"Oturumlar",liste:dugumler.filter(n=>n.tur==="seans")},{ad:"Hedefler",liste:dugumler.filter(n=>n.tur==="hedef")}]
    .concat(kats.map(k=>({ad:"İş · "+k,liste:dugumler.filter(n=>n.tur==="is"&&kategori(n)===k)}))).filter(b=>b.liste.length);
  const poz=new Map(); const satirY=30; let y=ust; const bantY=[];
  bantlar.forEach(b=>{ const dolu=new Map(); let altMax=0;
    b.liste.sort((a,c)=>d3.ascending(icraZaman(a),icraZaman(c))||d3.ascending(a.id,c.id)).forEach(n=>{ const xx=x(icraZaman(n)); const k=(dolu.get(xx)||0); dolu.set(xx,k+1); altMax=Math.max(altMax,k); poz.set(n.id,{x:xx,y:y+18+k*satirY}); });
    bantY.push({ad:b.ad,y0:y}); y=y+36+altMax*satirY; });
  const H=y+30;
  g.selectAll("*").remove(); svg.attr("width",Math.max(W,document.getElementById("graf").clientWidth)).attr("height",Math.max(H,560));
  bantY.forEach(b=>{ g.append("line").attr("class","bant").attr("x1",0).attr("x2",W).attr("y1",b.y0).attr("y2",b.y0); g.append("text").attr("class","bant-etiket").attr("x",8).attr("y",b.y0+22).text(b.ad.length>28?b.ad.slice(0,27)+"…":b.ad).append("title").text(b.ad); });
  gunCizgileri(anlar,x,adim,ust-8,H-18);
  kenarCiz(poz,kok);
  const d=g.selectAll("g.dugum").data(dugumler).join("g").attr("class",n=>"dugum"+(n.id===kok?" secili":"")+(hizmetSet.has(n.id)?" hizmetci":"")).attr("transform",n=>`translate(${poz.get(n.id).x},${poz.get(n.id).y})`).on("click",(ev,n)=>sec(n.id));
  dugumCiz(d);
  d.append("text").attr("y",-12).attr("text-anchor","middle").attr("font-size",10.5).text(n=>n.tur==="seans"?n.etiket.replace("2026-",""):(n.tur==="hedef"?"H"+n.id.split(":")[1]:"#"+n.id.split(":")[1]));
  panel(kok,hop);
}

function cizSira(kok){
  const hop=hopHesapla(kok);
  const dugumler=gorunenler().sort((a,b)=>d3.ascending(icraZaman(a),icraZaman(b))||d3.ascending(a.tur,b.tur)||d3.ascending(a.id,b.id));
  const sol=40, adim=46, yy=300; const W=sol+adim*dugumler.length+40;
  const poz=new Map(); dugumler.forEach((n,i)=>poz.set(n.id,{x:sol+i*adim,y:yy}));
  g.selectAll("*").remove(); svg.attr("width",Math.max(W,document.getElementById("graf").clientWidth)).attr("height",560);
  g.append("line").attr("class","bant").attr("x1",0).attr("x2",W).attr("y1",yy).attr("y2",yy);
  const anlar=[]; const x=new Map(); dugumler.forEach(n=>{ const z=icraZaman(n); if(!x.has(z)){x.set(z,poz.get(n.id).x); anlar.push(z);} });
  gunCizgileri(anlar,z=>x.get(z),adim,40,528);
  kenarCiz(poz,kok);
  const d=g.selectAll("g.dugum").data(dugumler).join("g").attr("class",n=>"dugum"+(n.id===kok?" secili":"")+(hizmetSet.has(n.id)?" hizmetci":"")).attr("transform",n=>`translate(${poz.get(n.id).x},${poz.get(n.id).y})`).on("click",(ev,n)=>sec(n.id));
  dugumCiz(d);
  d.append("text").attr("transform","rotate(-60) translate(14,-4)").attr("font-size",10).text(n=>(n.tur==="seans"?n.etiket.replace("2026-",""):(n.tur==="hedef"?"H":"#")+n.id.split(":")[1]+" "+kisa(n,22)));
  panel(kok,hop);
}

function sec(id){ const n=N.get(id);
  if(n.tur==="hedef"){ yol=hedefYolu(id).concat([id]); }            // hedefe tıkla → alt grafına in (kırıntı = üst zincir)
  else if(ust.has(id)){ const y=hedefYolu(id); if(y.join()!==yol.join()) yol=y; } // başka seviyedeki işe git → onun seviyesi
  kirintiYaz(); ciz(id); }
function seviyeyeGit(i){ yol=yol.slice(0,i); kirintiYaz(); ciz(kapsam()||secili); }
function kirintiYaz(){ const el=document.getElementById("kirinti"); const parca=["<button data-i='0'>Büyük resim</button>"];
  yol.forEach((h,i)=>parca.push(" › "+(i===yol.length-1?"<b>H"+h.split(":")[1]+"</b>":"<button data-i='"+(i+1)+"'>H"+h.split(":")[1]+"</button>")));
  el.innerHTML=parca.join(""); el.querySelectorAll("button").forEach(b=>b.onclick=()=>seviyeyeGit(+b.dataset.i)); }

function durumAcikla(d){ return {tamam:"İş bitti.",acik:"İş açık. Kimse bu işi şu anda yapmıyor.",islemde:"İş işlemde. Bir oturum bu işi yapıyor.",bayat:"İş bayat. Bu iş artık geçerli değil, kayıt durur."}[d]||("Durum: "+d+"."); }
function kenarCumle(k){
  const ad=adi(k.id);
  const m={acti:k.yon==="dis"?"Bu oturum "+ad+" düğümünü açtı.":ad+" bu düğümü açtı.",
    bitirdi:k.yon==="dis"?"Bu oturum "+ad+" düğümünü bitirdi.":ad+" bu düğümü bitirdi.",
    girdi:k.yon==="dis"?"Bu düğüm "+ad+" düğümüne girdi verir.":ad+" bu düğüme girdi verir.",
    hizmet:k.yon==="dis"?"Bu düğüm "+ad+" düğümüne hizmet eder.":ad+" bu düğüme hizmet eder.",
    sonra:k.yon==="dis"?ad+" bu oturumdan sonra gelir.":ad+" bu oturumdan önce gelir."};
  return m[k.tur]||(ad+" ile bağ: "+k.tur+".");
}
function liste(baslik,arr){ if(!arr||!arr.length) return ""; return "<h3>"+baslik+"</h3><ul>"+arr.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"; }
function olayCumle(o){
  const t=ts(o.ts); const k=(o.kanit||[]).length?" Kanıt: "+o.kanit.map(esc).join("; ")+".":""; const ot=o.oturum?" Oturum: "+esc(o.oturum)+".":"";
  return "<li>"+t+": "+({ac:"düğüm açıldı.",al:"bir oturum işi aldı.",bitir:"iş bitti.",bayatla:"iş bayatladı."}[o.olay]||esc(o.olay))+ot+k+"</li>";
}

    if(!z.canli&&!z.ozet){ const ac=(z.olaylar||[]).filter(o=>o.olay==="ac").map(o=>"#"+o.id+" "+(o.is||"")); const bt=(z.olaylar||[]).filter(o=>o.olay==="bitir").map(o=>"#"+o.id+(o.kanit&&o.kanit.length?" · kanıt: "+o.kanit.join("; "):"")); c.push("<p>Bu oturumun kayıt dosyası yoktur. Kütük olayları özeti aşağıdadır.</p>"); c.push(liste("Açılan işler",ac)); c.push(liste("Bitirilen işler",bt)); }
    if(n.ortuk) c.push("<p>Bu oturum örtük kayıttır. Kütük onu sonradan türetti.</p>");

    const ad=n.tur==="hedef"?"Hedef #"+num:"İş #"+num;
    c.push("<h2>"+ad+"</h2><div class='tur'>düğüm türü: "+n.tur+" · durum: "+n.durum+" · kategori: "+esc(kategori(n))+"</div>");
    if(n.tur==="hedef"){ const i=ilerleme(id); const u=ust.get(id);
      c.push("<p><b>İlerleme:</b> "+i.bitti+"/"+i.toplam+" iş bitti (%"+Math.round(i.oran*100)+")"+(i.alt?" · "+i.alt+" alt hedef":"")+(u?" · üst hedef: <button class='komsu' style='display:inline;width:auto;padding:1px 6px' data-id='"+u+"'>H"+u.split(":")[1]+"</button>":" · üst hedef yok (büyük resim)")+"</p>");
      if(yol.length>1) c.push("<button class='hedefe' id='ustcik'>Bir üst seviyeye çık</button>"); else if(yol.length===1) c.push("<button class='hedefe' id='ustcik'>Büyük resme dön</button>");
      const ah=altHedefler(id); if(ah.length) c.push("<h3>Alt hedefler (tıkla, içine in)</h3>"+ah.map(h=>{const j=ilerleme(h.id); return "<button class='komsu' data-id='"+h.id+"'>H"+h.id.split(":")[1]+" "+esc(kisa(h,60))+" · "+j.bitti+"/"+j.toplam+"</button>";}).join(""));
    } else if(ust.has(id)){ const h=N.get(ust.get(id)); const hy=hedefYolu(id);
      c.push("<p><b>Hizmet ettiği hedef:</b> <button class='komsu' style='display:inline;width:auto;padding:1px 6px' data-id='"+h.id+"'>H"+h.id.split(":")[1]+" · "+esc(kisa(h,60))+"</button>"+(hy.length>1?" <span style='color:var(--mut);font-size:12.5px'>(zincir: "+hy.map(x=>"H"+x.split(":")[1]).join(" › ")+")</span>":"")+"</p>"); }
    else c.push("<p><b>Hizmet ettiği hedef:</b> <span style='color:var(--mut)'>hedef yok</span></p>");
    c.push("<div class='kutu ozet'><h3>Ne oldu (ASD-STE100)</h3>");
    c.push("<p>Bu düğüm bir "+(n.tur==="hedef"?"hedeftir. Hedef bir alt grafın kapağıdır. Alt grafta işler ve alt hedefler vardır. Hedef, alt grafının en sağındadır. Alt graf bitince hedef biter.":"iştir.")+" "+durumAcikla(n.durum)+"</p>");
    c.push("<p><b>Konu:</b> "+esc(n.etiket)+"</p>");
    if(n.sonraki_eylem) c.push("<p><b>Sonraki adım:</b> "+esc(n.sonraki_eylem)+"</p>");
    const bitir=(z.olaylar||[]).filter(o=>o.olay==="bitir"&&o.kanit&&o.kanit.length);

    if(n.oturumlar&&n.oturumlar.length) c.push("<p>Bu işe dokunan oturumlar: "+n.oturumlar.map(o=>"<button class='komsu' style='display:inline;width:auto;padding:1px 6px' data-id='seans:"+esc(o)+"'>"+esc(o)+"</button>").join(" ")+"</p>");

  if(z.baglantilar&&z.baglantilar.length){ c.push("<div class='kutu'><h3>Ayrıntı metni · tıkla, dosyayı aç</h3><ul>"+z.baglantilar.map(b=>"<li><a href='"+b.url+"' target='_blank'>"+esc(b.ad)+"</a></li>").join("")+"</ul></div>"); }
  if(z.olaylar&&z.olaylar.length){ c.push("<div class='kutu'><details><summary>Kütük olayları ("+z.olaylar.length+")</summary><ul>"+z.olaylar.map(olayCumle).join("")+"</ul></details></div>"); }
  const ks=komsular.get(id)||[]; const gelen=ks.filter(k=>k.yon==="ic"), giden=ks.filter(k=>k.yon==="dis");
  const sirala=a=>a.sort((p,q)=>d3.ascending(icraZaman(N.get(p.id)),icraZaman(N.get(q.id))));
  c.push("<div class='kutu'><h3>◀ Geri: bu düğüme bağlananlar ("+gelen.length+")</h3>"+(gelen.length?sirala(gelen).map(k=>"<button class='komsu' data-id='"+k.id+"'>"+kenarCumle(k)+"</button>").join(""):"<p style='color:var(--mut)'>Yok.</p>")+"</div>");

  c.push("</table></details></div>");

// ---- B8: üst görev şeridi (bitmiş + sıradaki işler), hedef bağı, hizmet vurgusu ----
let hizmetSet=new Set(), seritAcik=false;
const SERIT_VARSAYILAN=12;
function hizmetcileri(id){ const n=N.get(id); if(!n||n.tur!=="hedef") return new Set(); const S=new Set(tumIsler(id).map(x=>x.id)); (function alt(h){ altHedefler(h).forEach(a=>{S.add(a.id); alt(a.id);}); })(id); return S; }
function hedefBag(id){ // iş kutusunda görünen hedef bağı: H<no> · <hedef etiketi ilk 30>
  const h=ust.get(id); if(!h) return "<span class='hedefbag yok'>hedef yok</span>";
  const e=N.get(h).etiket||h; return "<button class='hedefbag' data-hedef='"+h+"' title='"+esc(e)+"'>H"+h.split(":")[1]+" · "+esc(e.length>30?e.slice(0,30)+"…":e)+"</button>"; }
function seritListesi(){
  const isler=G.dugumler.filter(n=>n.tur==="is");
  const biten=isler.filter(bitti).sort((a,b)=>d3.ascending(bitis(a)||acilis(a),bitis(b)||acilis(b))||d3.ascending(a.id,b.id));
  const acik=isler.filter(n=>!bitti(n)).sort((a,b)=>d3.descending(!!a.sirada,!!b.sirada)||d3.ascending(acilis(a),acilis(b))||d3.ascending(a.id,b.id));
  return {biten,acik};
}
function seritCiz(){
  const el=document.getElementById("serit"); const {biten,acik}=seritListesi();
  const bitG=seritAcik?biten:biten.slice(-SERIT_VARSAYILAN);
  const sira=acik.filter(n=>n.sirada), acikG=seritAcik?acik:sira;
  const kutu=n=>{ const no=n.id.split(":")[1]; const zaman=bitti(n)?(bitis(n)||acilis(n)||"").slice(5,16).replace("T"," "):"açıldı "+(acilis(n)||"").slice(5,10);
    return "<div class='iskutu "+n.durum+(n.id===secili?" secili":"")+(hizmetSet.has(n.id)?" hizmetci":"")+"' data-id='"+n.id+"' role='button' tabindex='0' title='"+esc(n.etiket||"")+"'>"
      +"<span class='ust-satir'>#"+no+" · "+esc(n.durum)+(n.sirada?" · sırada":"")+" · "+esc(zaman)+"</span>"
      +"<span class='et'>"+esc(kisa(n,58))+"</span>"+hedefBag(n.id)+"</div>"; };
  el.className=seritAcik?"acik":"";
  el.innerHTML="<div class='serit-bas'><b style='color:var(--fg)'>Görev sırası</b><span>bitti: "+bitG.length+"/"+biten.length+" gösteriliyor · "+(seritAcik?"açık iş: "+acik.length:"sıradaki: "+sira.length+" (açık toplam "+acik.length+")")+"</span>"
    +"<button class='ust' id='serit-dugme'>"+(seritAcik?"Daralt (son "+SERIT_VARSAYILAN+")":"Tümünü göster")+"</button>"
    +(hizmetSet.size?"<span style='color:var(--hedef)'>vurgulu: "+esc(adi(secili))+" hedefine hizmet eden işler</span>":"")+"</div>"
    +"<div class='kutular'>"+bitG.map(kutu).join("")+(acikG.length?"<span style='flex:0 0 auto;align-self:center;color:var(--mut);font-size:12px'>▶ sırada / açık</span>"+acikG.map(kutu).join(""):"")+"</div>";
  document.getElementById("serit-dugme").onclick=()=>{ seritAcik=!seritAcik; seritCiz(); };
  el.querySelectorAll(".iskutu").forEach(k=>{ const ac=ev=>{ if(ev.target.closest(".hedefbag")) return; grafaDon(); sec(k.dataset.id); }; k.onclick=ac; k.onkeydown=ev=>{ if(ev.key==="Enter") ac(ev); }; });
  el.querySelectorAll(".hedefbag[data-hedef]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); grafaDon(); sec(b.dataset.hedef); });
  const s=el.querySelector(".iskutu.secili"); if(s&&!seritAcik) s.scrollIntoView({block:"nearest",inline:"nearest"});
}

// ---- B8: oda sekmesi (ortak/oda/<odaId>.json; şema jarvis-oda types Oda) ----
let sekme="graf";
function grafaDon(){ if(sekme!=="graf") sekmeSec("graf"); }
function sekmeSec(s){ sekme=s;
  document.getElementById("graf").style.display=s==="graf"?"":"none";
  document.getElementById("panel").style.display=s==="graf"?"":"none";
  document.getElementById("oda").style.display=s==="graf"?"none":"block";
  document.querySelectorAll("#sekmeler button").forEach(b=>b.classList.toggle("aktif",b.dataset.sekme===s));
  if(s!=="graf") odaCiz(ODALAR[+s.split(":")[1]]);
}
function sekmeleriKur(){ const el=document.getElementById("sekmeler"); if(!ODALAR.length){ el.innerHTML=""; return; }
  el.innerHTML="<button class='ust aktif' data-sekme='graf'>Graf</button>"+ODALAR.map((o,i)=>"<button class='ust' data-sekme='oda:"+i+"' title='"+esc(o.id||"")+"'>Oda · "+esc(String(o.baslik||o.id||"oda").slice(0,40))+"</button>").join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>sekmeSec(b.dataset.sekme)); }
function ilkSatir(m,uz){ const t=String(m||"").split(/\r?\n/).find(x=>x.trim())||""; return t.length>uz?t.slice(0,uz)+"…":t; }
function odaCiz(o){
  const el=document.getElementById("oda"); const c=[]; const gorevler=o.gorevler||[], oneriler=o.oneriler||[];
  const turlar=(o.turlar||[]).slice().sort((a,b)=>d3.ascending(a.ts,b.ts));
  const gAd=new Map(gorevler.map(g=>[g.id,g.baslik]));
  const etiket=id=>(id===undefined||id===null)?"":"<span class='etiket'>[#"+id+" · "+esc(gAd.get(id)||"?")+"]</span> ";
  c.push("<h2>Oda · "+esc(o.baslik||"")+"</h2><div style='color:var(--mut);font-size:12.5px'>"+esc(o.id||"")+" · açılış "+esc(ts(o.acilis)||"?")+" · maksParalel "+esc(o.maksParalel)+" · "+gorevler.length+" görev · "+turlar.length+" tur · kaynak <code>"+esc(o._dosya||"")+"</code></div>");
  c.push("<h3>Görevler ("+gorevler.length+") · başlığa tıkla, emir ve sonuç açılır</h3><table><tr><th>#</th><th>başlık</th><th>durum</th><th>sınıf</th><th>model</th><th>zorluk</th><th>iş</th></tr>");
  gorevler.forEach(g=>{ const isId=(g.isId!==undefined&&g.isId!==null)?"is:"+g.isId:null;
    c.push("<tr><td>#"+g.id+"</td><td><details><summary>"+esc(g.baslik)+"</summary>"+(g.done?"<p><b>Done:</b> "+esc(g.done)+"</p>":"")+(g.dosyalar&&g.dosyalar.length?"<p><b>Dosyalar:</b> "+g.dosyalar.map(esc).join(", ")+"</p>":"")
      +"<p style='color:var(--mut);font-size:12px'>açılış "+esc(ts(g.acilis)||"?")+(g.kapanis?" · kapanış "+esc(ts(g.kapanis)):"")+(g.cagri!==undefined?" · çağrı "+g.cagri+(g.butce?"/"+g.butce:""):"")+(g.ajan?" · ajan "+esc(g.ajan):"")+"</p>"
      +"<b>Emir</b><pre>"+esc(g.emir||"")+"</pre>"+(g.sonuc?"<b>Sonuç</b><pre>"+esc(g.sonuc)+"</pre>":"")+"</details></td>"
      +"<td><span class='rozet-d'>"+esc(g.durum)+"</span></td><td>"+esc(g.sinif||"planli")+"</td><td>"+esc(g.model||"")+"</td><td>"+esc(g.zorluk||"")+"</td>"
      +"<td>"+(isId?(N.has(isId)?"<button class='git' data-id='"+isId+"'>#"+g.isId+" grafta</button>":"#"+esc(g.isId)+" (grafta yok)"):"—")+"</td></tr>"); });
  c.push("</table>");
  const raporlar=turlar.filter(t=>t.tur==="rapor");
  c.push("<h3>İşçi raporları ("+raporlar.length+") · satıra tıkla, tam metin</h3>");
  c.push(raporlar.length?raporlar.map(t=>"<details style='border-top:1px solid var(--line);padding:4px 0'><summary><span style='color:var(--mut);font-size:11.5px'>"+esc(ts(t.ts))+" · "+esc(t.kim)+"</span> "+etiket(t.gorevId)+esc(ilkSatir(t.metin,140))+"</summary><pre>"+esc(t.metin)+"</pre></details>").join(""):"<p style='color:var(--mut)'>Rapor yok.</p>");
  if(oneriler.length) c.push("<h3>Öneriler ("+oneriler.length+")</h3><table><tr><th>#</th><th>öneri</th><th>durum</th></tr>"+oneriler.map(r=>"<tr><td>"+r.id+"</td><td>"+etiket(r.gorevId)+esc(r.metin)+"<div style='color:var(--mut);font-size:12px'>gerekçe: "+esc(r.gerekce||"")+(r.not?" · not: "+esc(r.not):"")+"</div></td><td><span class='rozet-d'>"+esc(r.durum)+"</span></td></tr>").join("")+"</table>");
  c.push("<h3>Sohbet akışı (tam, "+turlar.length+" tur)</h3><div class='akis'>");
  turlar.forEach(t=>c.push("<div class='tur-satir'><div class='meta'>"+esc(ts(t.ts))+" · "+esc(t.kim)+" · "+esc(t.tur)+"</div>"+etiket(t.gorevId)+"<span class='metin'>"+esc(t.metin)+"</span></div>"));
  c.push("</div>");
  el.innerHTML=c.join(""); el.scrollTop=0;
  el.querySelectorAll("button.git").forEach(b=>b.onclick=()=>{ sekmeSec("graf"); sec(b.dataset.id); });
}

function gorunumSec(gn){ gorunum=gn; document.getElementById("g-bant").classList.toggle("aktif",gn==="bant"); document.getElementById("g-sira").classList.toggle("aktif",gn==="sira"); ciz(secili); }
document.getElementById("g-bant").onclick=()=>gorunumSec("bant");
document.getElementById("g-sira").onclick=()=>gorunumSec("sira");

window.addEventListener("resize",()=>ciz(secili));
sekmeleriKur(); kirintiYaz(); ciz(MERKEZ);
</script>

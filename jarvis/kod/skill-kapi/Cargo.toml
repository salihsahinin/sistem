[package]
name = "skill-kapi"
description = "Skill-üretim kapı ağacı K0-K3 hükmü (spec: jarvis/lean/Kanon/SkillKapi.lean)"
edition.workspace = true
version.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "skill-kapi"
path = "src/main.rs"
